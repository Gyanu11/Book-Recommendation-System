{% extends "auth_base.html" %}

{% block content %}
<div style="text-align: center; margin-bottom: 24px; padding: 20px; background: rgba(244, 63, 94, 0.1); border-radius: var(--radius); border: 1px solid rgba(244, 63, 94, 0.2);">
    <div style="width: 44px; height: 44px; background: rgba(244, 63, 94, 0.15); color: #f43f5e; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; font-size: 18px;">
        <i class="fas fa-exclamation-triangle"></i>
    </div>
    <h1 style="font-size: 20px; font-weight: 700; margin-bottom: 6px; color: #f43f5e;">Admin Reset</h1>
    <p style="color: var(--muted-foreground); font-size: 14px;">Reset administrative credentials.</p>
</div>

<form method="POST" style="display: flex; flex-direction: column; gap: 16px;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div>
        <label><i class="fas fa-key" style="margin-right: 6px; color: var(--muted-foreground);"></i> Admin Authorization Key</label>
        {{ form.admin_code(placeholder="Enter admin key", style="width: 100%;") }}
    </div>

    <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; padding: 14px; background: #f43f5e; color: white; border-color: #f43f5e;">
        <i class="fas fa-sync-alt"></i> Reset Admin Account
    </button>
</form>

<div style="margin-top: 20px; text-align: center; font-size: 14px; color: var(--muted-foreground);">
    Need to go back? <a href="{{ url_for('auth.register') }}" style="color: var(--primary); text-decoration: none; font-weight: 600;">Create Account</a>
</div>
{% endblock %}
