{% extends "auth_base.html" %}

{% block content %}
<div style="text-align: center; margin-bottom: 20px;">
    <div style="width: 48px; height: 48px; background: rgba(59, 130, 246, 0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; color: #3b82f6;">
        <i class="fas fa-shield-alt" style="font-size: 20px;"></i>
    </div>
    <h1 style="font-size: 22px; font-weight: 600; margin-bottom: 4px;">Admin Portal</h1>
    <p style="color: var(--muted-foreground); font-size: 14px;">Please authenticate to access the management panel.</p>
</div>

<form method="POST" style="display: flex; flex-direction: column; gap: 14px;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div>
        <label style="font-size: 12px; font-weight: 500; color: var(--muted-foreground); margin-bottom: 6px; display: block;">Administrative Email</label>
        <input type="email" name="email" placeholder="admin@bookify.com" required style="width: 100%; padding: 10px 14px; border: 1px solid var(--input); border-radius: var(--radius); background: var(--background); color: var(--foreground); font-size: 14px;">
    </div>

    <div>
        <label style="font-size: 12px; font-weight: 500; color: var(--muted-foreground); margin-bottom: 6px; display: block;">Password</label>
        <input type="password" name="password" placeholder="••••••••" required style="width: 100%; padding: 10px 14px; border: 1px solid var(--input); border-radius: var(--radius); background: var(--background); color: var(--foreground); font-size: 14px;">
    </div>

    <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; padding: 12px; margin-top: 4px; background: #3b82f6;">
        Authenticate Admin
    </button>
</form>

<div style="margin-top: 20px; text-align: center;">
    <a href="{{ url_for('main.index') }}" style="font-size: 12px; color: var(--muted-foreground); text-decoration: none;">
        <i class="fas fa-arrow-left"></i> Back to Bookstore
    </a>
</div>
{% endblock %}
