<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Authentication{% endblock %} - Book Library</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body style="margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--background); font-family: var(--font-sans); padding: 20px;">

    <!-- Background Decorative Elements -->
    <div style="position: fixed; top: -200px; left: -200px; width: 500px; height: 500px; background: radial-gradient(circle, rgba(37, 99, 235, 0.1) 0%, transparent 70%); border-radius: 50%; filter: blur(80px); pointer-events: none;"></div>
    <div style="position: fixed; bottom: -200px; right: -200px; width: 500px; height: 500px; background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, transparent 70%); border-radius: 50%; filter: blur(80px); pointer-events: none;"></div>

    <div class="auth-container" style="width: 100%; max-width: 400px; position: relative; z-index: 10;">
        <!-- Close Button -->
        <a href="{{ url_for('main.index') }}" style="position: absolute; top: -10px; right: -10px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--card); border: 1px solid var(--border); color: var(--muted-foreground); text-decoration: none; transition: all 0.2s; z-index: 20; box-shadow: var(--shadow-md);">
            <i class="fas fa-times"></i>
        </a>

        <!-- Logo -->
        <div style="text-align: center; margin-bottom: 28px;">
            <div style="width: 44px; height: 44px; background: var(--primary); color: var(--primary-foreground); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; margin: 0 auto 14px;">
                <i class="fas fa-book"></i>
            </div>
            <h2 style="margin: 0; color: var(--foreground); font-size: 20px; font-weight: 600;">Book Library</h2>
        </div>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div style="margin-bottom: 20px;">
                {% for category, message in messages %}
                <div style="padding: 12px 16px; background: var(--secondary); border-left: 3px solid var(--primary); border-radius: var(--radius); font-size: 13px; color: var(--foreground); margin-bottom: 8px; font-weight: 500; border: 1px solid var(--border);">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}
        {% endwith %}

        <div class="auth-content">
            {% block content %}{% endblock %}
        </div>

    </div>

    <style>
        body {
            overflow-x: hidden;
        }

        .auth-container {
            max-height: 95vh;
            display: flex;
            flex-direction: column;
        }

        .auth-content {
            overflow-y: auto;
            scrollbar-width: none;
        }

        .auth-content::-webkit-scrollbar {
            display: none;
        }

        @media (max-width: 480px) {
            .auth-container {
                padding: 24px;
                border-radius: var(--radius);
                max-width: 100%;
            }

            body {
                padding: 16px;
                overflow: auto;
            }
        }

        input:focus {
            border-color: var(--ring) !important;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15) !important;
        }

        button:hover {
            opacity: 0.9;
        }

        .auth-container > a:hover {
            background: var(--secondary) !important;
            color: var(--foreground) !important;
            transform: scale(1.1);
        }
    </style>
</body>

</html>
