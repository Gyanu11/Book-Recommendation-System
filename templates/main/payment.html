{% extends "base.html" %}

{% block content %}
<style>
    .payment-page {
        max-width: 420px;
        margin: 0 auto;
        padding: 40px 24px;
    }
    
    .payment-header {
        text-align: center;
        margin-bottom: 32px;
    }
    
    .payment-icon {
        width: 56px;
        height: 56px;
        background: var(--primary);
        color: var(--primary-foreground);
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        margin: 0 auto 16px;
    }
    
    .payment-header h1 {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 8px;
    }
    
    .payment-header .total-display {
        font-size: 32px;
        font-weight: 700;
        color: var(--primary);
        margin-top: 8px;
    }
    
    .payment-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 28px;
        box-shadow: var(--shadow-xl);
    }
    
    .form-group {
        margin-bottom: 16px;
    }
    
    .form-group label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 8px;
    }
    
    .form-group input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--input);
        border-radius: var(--radius);
        background: var(--background);
        color: var(--foreground);
        font-size: 14px;
        font-family: inherit;
        transition: all 0.15s;
    }
    
    .form-group input:focus {
        outline: none;
        border-color: var(--ring);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }
    
    .form-group input::placeholder {
        color: var(--muted-foreground);
    }
    
    .input-with-icon {
        position: relative;
    }
    
    .input-with-icon input {
        padding-left: 42px;
    }
    
    .input-with-icon i {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--muted-foreground);
    }
    
    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }
    
    .pay-btn {
        width: 100%;
        padding: 14px;
        font-size: 15px;
        font-weight: 600;
        justify-content: center;
        border-radius: 10px;
        margin-top: 8px;
    }
    
    .secure-note {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 16px;
        font-size: 12px;
        color: var(--muted-foreground);
    }
    
    .secure-note i {
        color: #22c55e;
    }
    
    .cancel-link {
        display: block;
        text-align: center;
        margin-top: 16px;
        color: var(--muted-foreground);
        text-decoration: none;
        font-size: 13px;
    }
    
    .cancel-link:hover {
        color: var(--foreground);
    }
</style>

<div class="payment-page">
    <!-- Header -->
    <div class="payment-header">
        <div class="payment-icon">
            <i class="fas fa-lock"></i>
        </div>
        <h1>Secure Checkout</h1>
        <div class="total-display">${{ "%.2f"|format(total) }}</div>
    </div>

    <div class="payment-card">
        <form action="{{ url_for('main.process_payment') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

            {% for item_id in item_ids %}
            <input type="hidden" name="item_ids" value="{{ item_id }}" />
            {% endfor %}

            <div class="form-group">
                <label>Cardholder Name</label>
                <input type="text" name="card_name" placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label>Card Number</label>
                <div class="input-with-icon">
                    <i class="fas fa-credit-card"></i>
                    <input type="text" name="card_number" placeholder="0000 0000 0000 0000" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Expiry Date</label>
                    <input type="text" name="expiry" placeholder="MM/YY" required>
                </div>
                <div class="form-group">
                    <label>CVC</label>
                    <input type="text" name="cvc" placeholder="123" required>
                </div>
            </div>

            <button type="submit" class="btn-primary pay-btn">
                <i class="fas fa-lock"></i> Pay Now
            </button>
            
            <div class="secure-note">
                <i class="fas fa-shield-alt"></i>
                <span>Secured with AES-256 encryption</span>
            </div>
        </form>
    </div>
    
    <a href="{{ url_for('main.cart') }}" class="cancel-link">
        <i class="fas fa-arrow-left"></i> Back to Cart
    </a>
</div>
{% endblock %}
